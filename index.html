<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ешка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --md-icon-font:'Material Symbols Rounded';
  --e-dec:cubic-bezier(.05,.7,.1,1);--e-acc:cubic-bezier(.3,0,.8,.15);--e-std:cubic-bezier(.2,0,0,1);
  /* expressive spring (с лёгким перелётом) */
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  --font:'Roboto Flex',Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font:400 14px/20px var(--font);letter-spacing:.2px;text-transform:lowercase;padding:0 0 calc(112px + env(safe-area-inset-bottom,0))}
[hidden]{display:none!important}
#catalog,#faqPage{position:relative;z-index:0}
button{font:inherit;color:inherit;text-transform:inherit;border:0;background:none;padding:0;cursor:pointer;outline:none}
md-icon{font-family:'Material Symbols Rounded'}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-45deg)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}

/* верхняя панель: крупный заголовок, при прокрутке плавно окрашивается */
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;min-height:calc(88px + env(safe-area-inset-top,0));padding:env(safe-area-inset-top,0) 20px 8px;background:var(--md-sys-color-surface);transition:background-color .25s var(--e-std)}
.appbar.scrolled{background:var(--md-sys-color-surface-container)}
.appbar h1{margin:0;font:800 44px/52px var(--font);font-stretch:108%;letter-spacing:-.5px;color:var(--md-sys-color-on-surface);animation:slideIn .6s var(--e-dec) backwards}

.search{display:flex;align-items:center;gap:12px;height:56px;margin:8px 16px;padding:0 8px 0 20px;border-radius:28px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);transition:background-color .25s var(--e-std),border-radius .4s var(--spring);animation:rise .6s var(--e-dec) backwards .05s}
.search:focus-within{background:var(--md-sys-color-surface-container-highest);border-radius:20px;box-shadow:inset 0 0 0 2px var(--md-sys-color-primary)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--md-sys-color-on-surface);font:500 16px/24px var(--font);text-transform:lowercase}
.search input::placeholder{color:var(--md-sys-color-on-surface-variant);opacity:1}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{position:relative;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--md-sys-color-on-surface-variant);opacity:0;transform:scale(.4) rotate(-90deg);pointer-events:none;transition:opacity .2s var(--e-std),transform .45s var(--spring)}
.search.has .iconbtn{opacity:1;transform:none;pointer-events:auto}

/* чипы: выбранный чип превращается из пилюли в скруглённый квадрат */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;animation:rise .6s var(--e-dec) backwards .1s}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:20px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);font:600 14px/20px var(--font);transition:background-color .25s var(--e-std),color .25s var(--e-std),border-radius .5s var(--spring),padding .35s var(--e-dec),transform .3s var(--spring)}
.chip.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-radius:12px;padding:0 18px 0 12px}
.chip md-icon{--md-icon-size:18px;animation:pop .5s var(--spring)}
.chip:active{transform:scale(.92)}
.chip:focus-visible,.card:focus-visible,.tab:focus-visible,.buy:focus-visible{box-shadow:0 0 0 3px var(--md-sys-color-primary)}

/* цвета и формы медиа-блоков: каждая карточка в своём тональном контейнере */
[data-t="0"]{--tc:var(--md-sys-color-primary-container);--on:var(--md-sys-color-on-primary-container)}
[data-t="1"]{--tc:var(--md-sys-color-tertiary-container);--on:var(--md-sys-color-on-tertiary-container)}
[data-t="2"]{--tc:var(--md-sys-color-secondary-container);--on:var(--md-sys-color-on-secondary-container)}

.grid{display:grid;gap:10px;padding:8px 16px}
.card{position:relative;display:flex;align-items:center;gap:16px;padding:22px 20px 22px 24px;border-radius:32px;background:var(--tc);color:var(--on);overflow:hidden;cursor:pointer;animation:rise .65s var(--e-dec) backwards;animation-delay:calc(var(--i,0)*55ms + 150ms);transition:transform .45s var(--spring),border-radius .5s var(--spring)}
.card:active{transform:scale(.97);border-radius:20px}
.txt{flex:1;min-width:0}
.name{display:block;font:800 22px/28px var(--font);font-stretch:104%;letter-spacing:-.2px}
.cat{display:block;margin-top:2px;opacity:.75}
.price{flex:none;padding:6px 16px;border-radius:16px;background:var(--on);color:var(--tc);font:800 18px/24px var(--font);transition:border-radius .5s var(--spring)}
.card:active .price{border-radius:8px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;font:500 16px/24px var(--font);color:var(--md-sys-color-on-surface-variant);animation:fade .3s var(--e-std)}

/* faq: сгруппированный список, открытый пункт «расправляется» */
.faq{display:grid;gap:2px;padding:8px 16px}
details{border-radius:8px;background:var(--md-sys-color-surface-container-high);overflow:hidden;animation:rise .6s var(--e-dec) backwards;animation-delay:calc(var(--i,0)*60ms + 100ms);transition:border-radius .5s var(--spring),background-color .25s var(--e-std),margin .4s var(--e-dec)}
details:first-child{border-radius:28px 28px 8px 8px}
details:last-child{border-radius:8px 8px 28px 28px}
details.is-open{border-radius:28px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);margin:6px 0}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:8px 12px 8px 20px;font:700 16px/22px var(--font);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:20px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface-variant);transition:transform .5s var(--spring),background-color .25s var(--e-std),border-radius .5s var(--spring)}
details.is-open summary i{transform:rotate(180deg);background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);border-radius:14px}
details p{margin:0;padding:0 20px 20px;font:400 16px/24px var(--font);opacity:.85}
.note{margin:16px 24px;text-align:center;font:400 12px/16px var(--font);letter-spacing:.4px;color:var(--md-sys-color-on-surface-variant)}

/* плавающий тулбар */
.toolbar{position:fixed;z-index:5;left:0;right:0;margin:auto;width:max-content;bottom:calc(16px + env(safe-area-inset-bottom,0));display:flex;gap:4px;padding:8px;border-radius:36px;background:var(--md-sys-color-surface-container-high);box-shadow:0 4px 14px rgb(0 0 0/.18),0 10px 30px rgb(0 0 0/.14);animation:rise .7s var(--e-dec) backwards .3s}
.tab{position:relative;display:flex;align-items:center;height:56px;padding:0 18px;border-radius:28px;color:var(--md-sys-color-on-surface-variant);font:700 15px/20px var(--font);transition:background-color .3s var(--e-std),color .3s var(--e-std),padding .5s var(--spring),border-radius .5s var(--spring)}
.tab span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .5s var(--e-dec),opacity .2s var(--e-std),margin .5s var(--e-dec)}
.tab.on{padding:0 24px;border-radius:24px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.tab.on span{max-width:140px;opacity:1;margin-left:10px}
.tab md-icon{--md-icon-size:26px;transition:font-variation-settings .3s}
.tab.on md-icon{font-variation-settings:'FILL' 1}
.tab:active{transform:scale(.94)}

/* модальная шторка */
.scrim{position:fixed;z-index:10;inset:0;background:var(--md-sys-color-scrim);opacity:0;pointer-events:none;transition:opacity .2s var(--e-std)}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:40px 40px 0 0;background:var(--md-sys-color-surface-container-low);padding:0 16px calc(24px + env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .2s var(--e-acc)}
.open .scrim{opacity:.32;pointer-events:auto;transition-duration:.3s}
.open .sheet{transform:none;transition:transform .5s var(--e-dec)}
.handle{width:36px;height:4px;border-radius:2px;margin:20px auto;background:var(--md-sys-color-on-surface-variant);opacity:.4}
.open .sheet .st{animation:rise .6s var(--e-dec) backwards;animation-delay:calc(var(--i,0)*55ms + 120ms)}
.tag{display:inline-block;margin-top:4px;padding:6px 16px;border-radius:12px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);font:600 14px/20px var(--font)}
.sheet h2{margin:12px 0 0;font:800 32px/40px var(--font);font-stretch:104%;letter-spacing:-.3px}
.pill{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:16px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font:800 20px/28px var(--font)}
.info{display:grid;gap:2px;margin-top:20px}
.info>div{padding:14px 20px;border-radius:8px;background:var(--md-sys-color-surface-container-highest)}
.info>div:first-child{border-radius:24px 24px 8px 8px}
.info>div:last-child{border-radius:8px 8px 24px 24px}
.info>div:only-child{border-radius:24px}
.info small{display:block;font:700 12px/16px var(--font);letter-spacing:.5px;color:var(--md-sys-color-primary)}
.info p{margin:2px 0 0;font:400 16px/24px var(--font)}
.buy{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:64px;margin-top:24px;border-radius:32px;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);font:700 18px/24px var(--font);transition:border-radius .5s var(--spring),transform .5s var(--spring)}
.buy:active{border-radius:18px;transform:scale(.97)}
.buy.off{background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface-variant);opacity:.8;cursor:default;pointer-events:none}
.card.out .price{opacity:.55}
.card.out .name{text-decoration:line-through;text-decoration-thickness:2px}
.card.out .cat{opacity:.9;font-weight:700}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- редактирование ---------- */
.appbar{justify-content:space-between;align-items:flex-end}
.appbar h1{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.admin .appbar h1::after{content:'';display:inline-block;width:10px;height:10px;margin-left:10px;border-radius:5px;background:var(--md-sys-color-tertiary);vertical-align:middle}
.ed{position:relative;display:none;flex:none;width:40px;height:40px;border-radius:20px;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit}
#settings{width:48px;height:48px;border-radius:24px;margin-bottom:4px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
body.admin #settings,body.admin .ed{display:grid}
.ed md-icon{--md-icon-size:20px}
.fabs{position:fixed;z-index:6;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0));display:none;flex-direction:column;align-items:flex-end;gap:12px}
body.admin .fabs{display:flex}
.fab{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 22px 0 18px;border-radius:28px;font:700 16px/24px var(--font);box-shadow:0 4px 14px rgb(0 0 0/.2);animation:rise .5s var(--e-dec) backwards;transition:border-radius .5s var(--spring),transform .5s var(--spring)}
.fab:active{border-radius:16px;transform:scale(.95)}
.fab.add{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.fab.pub{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.fab.busy{opacity:.7;pointer-events:none}
.snack{position:fixed;z-index:12;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0));margin:auto;width:fit-content;max-width:calc(100% - 32px);padding:14px 20px;border-radius:16px;background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);font:500 14px/20px var(--font);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .2s var(--e-std),transform .45s var(--spring)}
.snack.on{opacity:1;transform:none}
.fld{display:block;margin-top:14px}
.fld span{display:block;margin:0 0 6px 16px;font:700 12px/16px var(--font);letter-spacing:.5px;color:var(--md-sys-color-primary)}
.fld input,.fld textarea,.fld select{width:100%;border:0;outline:0;border-radius:16px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);font:500 16px/24px var(--font);padding:14px 16px;resize:vertical;text-transform:lowercase;transition:box-shadow .2s var(--e-std)}
.fld input[type=url],.fld input[type=password],.fld input[name=repo]{text-transform:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{box-shadow:inset 0 0 0 2px var(--md-sys-color-primary)}
.fld input.color{height:56px;padding:6px}
.hint{margin:8px 0 0;font:400 14px/20px var(--font);color:var(--md-sys-color-on-surface-variant)}
.row{display:flex;gap:8px;margin-top:24px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 22px;border-radius:28px;font:700 16px/24px var(--font);transition:border-radius .5s var(--spring),transform .5s var(--spring),background-color .25s var(--e-std)}
.btn:active{border-radius:16px;transform:scale(.96)}
.btn.sq{width:56px;padding:0;flex:none}
.btn.fill{flex:1;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.btn.tonal{flex:1;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.btn.tonal.sq{flex:none}
.btn.err{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.btn.err.armed{width:auto;padding:0 20px;background:var(--md-sys-color-error);color:var(--md-sys-color-on-error)}

/* ---------- динамические вкладки и инфо-блоки ---------- */
#pages section{position:relative;z-index:0}
.appbar-btns{display:flex;gap:8px;margin-bottom:4px}
.appbar-btns .ed{width:48px;height:48px;border-radius:24px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.tabs-list{display:grid;gap:8px;margin-top:16px}
.tab-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--md-sys-color-surface-container-highest);cursor:pointer;transition:transform .3s var(--spring)}
.tab-item:active{transform:scale(.97)}
.tab-item span{flex:1;font:700 16px/22px var(--font)}
.tab-item small{opacity:.65;font-size:12px}
.blocks{display:grid;gap:10px;padding:8px 16px}
.blk{position:relative;padding:20px;border-radius:28px;background:var(--md-sys-color-surface-container-high);animation:rise .6s var(--e-dec) backwards;animation-delay:calc(var(--i,0)*60ms + 100ms)}
.blk-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.blk h3{margin:0;font:800 20px/26px var(--font)}
.blk p{margin:8px 0 0;font:400 15px/22px var(--font);opacity:.85;white-space:pre-line}
.blk .buy{height:48px;margin-top:14px;font-size:15px}

/* ---------- вкладка «игра» (material you 3) ---------- */
.g-wrap{display:grid;gap:12px;padding:4px 0 8px}
.g-wrap.g-anim{animation:fade .2s var(--e-std)}
.g-wrap .chips{animation:none}
.g-wrap .chip md-icon{animation:none}
.g-app-right{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.g-top-pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font:800 14px/20px var(--font)}
.g-top-pill md-icon{--md-icon-size:18px}
.g-help-btn{position:relative;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);cursor:pointer;overflow:hidden}
.g-help-btn md-icon{--md-icon-size:20px}
.u-theme-btn{position:relative;flex:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);cursor:pointer;overflow:hidden;transition:transform .25s var(--spring),background-color .2s}
.u-theme-btn:active{transform:scale(.92)}
.u-theme-btn md-icon{--md-icon-size:20px}
.ut-swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.ut-sw{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:2px solid transparent;transition:transform .25s var(--spring),border-color .2s;overflow:hidden}
.ut-sw:active{transform:scale(.9)}
.ut-sw.on{border-color:var(--md-sys-color-on-surface);transform:scale(1.08)}
.ut-sw md-icon{--md-icon-size:20px;color:#fff;filter:drop-shadow(0 1px 2px rgb(0 0 0/.55))}
.ut-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding:4px;border-radius:22px;background:var(--md-sys-color-surface-container-highest)}
.ut-seg.s3{grid-template-columns:repeat(3,1fr)}
.ut-seg button{position:relative;height:38px;border-radius:18px;font:700 12px/16px var(--font);color:var(--md-sys-color-on-surface-variant);overflow:hidden;transition:background-color .2s,color .2s}
.ut-seg button.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}

.g-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 20px 0;font:700 13px/18px var(--font);color:var(--md-sys-color-on-surface-variant)}
.g-dots{display:inline-flex;gap:6px;align-items:center}
.g-dot{width:10px;height:10px;border-radius:5px;background:var(--md-sys-color-primary);transition:background-color .2s var(--e-std),opacity .2s}
.g-dot.off{background:var(--md-sys-color-surface-container-highest);opacity:.45}

/* чистая выразительная карточка пациента в стиле .card */
.g-hero{margin:0 16px;padding:22px 22px 20px;border-radius:32px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g-hname{font:800 24px/30px var(--font);font-stretch:104%;letter-spacing:-.3px}
.g-hwt{flex:none;padding:6px 14px;border-radius:16px;background:var(--md-sys-color-on-primary-container);color:var(--md-sys-color-primary-container);font:800 15px/20px var(--font)}
.g-hsub{margin-top:6px;font:600 13px/18px var(--font);opacity:.82}
.g-quote{margin:12px 0 0;font:400 15px/21px var(--font);opacity:.92}

/* M3 Segmented Button для вкладок досье */
.g-seg{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;padding:4px;border-radius:24px;background:var(--md-sys-color-surface-container-high);gap:4px}
.g-seg-btn{position:relative;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:5px;font:700 13px/18px var(--font);color:var(--md-sys-color-on-surface-variant);cursor:pointer;overflow:hidden;transition:background-color .2s var(--e-std),color .2s var(--e-std)}
.g-seg-btn.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.g-dot-ind{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--md-sys-color-primary)}

.g-hint{padding:0 22px;font:500 12px/16px var(--font);color:var(--md-sys-color-on-surface-variant)}
.g-facts{display:grid;gap:2px;padding:0 16px}
.g-facts.g-sec-fade{animation:fade .15s var(--e-std)}
.g-fact{position:relative;padding:15px 20px;border-radius:8px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);cursor:pointer;overflow:hidden;transition:background-color .22s var(--e-std)}
.g-fact:first-child{border-radius:24px 24px 8px 8px}
.g-fact:last-child{border-radius:8px 8px 24px 24px}
.g-fact:only-child{border-radius:24px}
.g-fact:active{opacity:.9}
.g-fact.scan{box-shadow:inset 0 0 0 2px var(--md-sys-color-tertiary)}
.g-fact.f-bad,.g-fact.f-ban{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.g-fact.f-caution{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.g-fact.f-safe{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.g-ftop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.g-flbl{display:block;font:700 12px/16px var(--font);letter-spacing:.3px;color:var(--md-sys-color-primary)}
.g-fact.f-bad .g-flbl,.g-fact.f-ban .g-flbl,.g-fact.f-caution .g-flbl,.g-fact.f-safe .g-flbl{color:inherit;opacity:.75}
.g-fval{display:block;font:400 15px/21px var(--font);margin-top:4px;white-space:pre-line}
.g-fbadge{flex:none;padding:4px 10px;border-radius:12px;font:800 11px/14px var(--font);background:color-mix(in srgb,currentColor 16%,transparent)}
.g-fnote{margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb,currentColor 16%,transparent);font:500 13px/19px var(--font);opacity:.92;white-space:pre-line}

.g-action{padding:4px 16px 0}
.g-action .buy{margin-top:4px}

.g-prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.g-prod{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 12px;border-radius:24px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);text-align:center;cursor:pointer;overflow:hidden;transition:background-color .22s var(--e-std),color .22s var(--e-std),border-radius .45s var(--spring)}
.g-prod.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);border-radius:16px;box-shadow:inset 0 0 0 2px var(--md-sys-color-primary)}
.g-prod img{width:100%;height:52px;object-fit:contain}
.g-prod b{font:800 13px/17px var(--font)}
.g-prod small{font:600 11px/15px var(--font);opacity:.78}

.g-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.g-sec-lbl{margin:16px 0 0;font:700 12px/16px var(--font);letter-spacing:.4px;color:var(--md-sys-color-primary)}
.g-wrap .faq p{white-space:pre-line}

.g-mod-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container);font:700 11px/15px var(--font)}
.g-bag-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.g-bag-row::-webkit-scrollbar{display:none}
.g-bag-btn{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface);font:700 12px/16px var(--font);cursor:pointer;overflow:hidden}
.g-bag-btn.on{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.g-bag-btn md-icon{--md-icon-size:16px}

.g-blitz-track{height:8px;margin:10px 0 0;border-radius:4px;background:color-mix(in srgb,var(--md-sys-color-on-primary-container) 18%,transparent);overflow:hidden}
.g-blitz-fill{height:100%;width:100%;border-radius:4px;background:var(--md-sys-color-on-primary-container);transition:width .1s linear}
.g-blitz-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.g-b-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:66px;padding:12px 14px;border-radius:22px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);text-align:left;cursor:pointer;overflow:hidden;transition:transform .2s var(--spring),background-color .15s}
.g-b-btn:active{transform:scale(.95)}
.g-b-btn b{font:800 14px/18px var(--font)}
.g-b-btn small{font:500 11px/14px var(--font);opacity:.75}
.g-b-btn.ban{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.g-b-btn.ok{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}

.g-grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.g-cell{position:relative;min-height:92px;padding:10px 8px;border-radius:24px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:pointer;overflow:hidden;transition:transform .16s var(--spring),background-color .15s var(--e-std),border-radius .25s var(--spring)}
.g-cell:active{transform:scale(.93)}
.g-cell md-icon{--md-icon-size:24px}
.g-cell b{font:800 12px/15px var(--font)}
.g-cell small{font:600 10px/13px var(--font);opacity:.8}
.g-cell.empty{opacity:.42;cursor:default}
.g-cell.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.g-cell.gold{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);box-shadow:inset 0 0 0 2px var(--md-sys-color-primary)}
.g-cell.safe{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}

.g-alch-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.g-alch-slot{min-height:66px;padding:10px 8px;border-radius:20px;background:var(--md-sys-color-surface-container-highest);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;font:700 12px/15px var(--font);color:var(--md-sys-color-on-surface-variant)}
.g-alch-slot.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-alch-slot.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.g-ing-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px}
.g-ing{position:relative;padding:12px 14px;border-radius:20px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);text-align:left;cursor:pointer;overflow:hidden;transition:background-color .18s var(--e-std),border-radius .3s var(--spring)}
.g-ing.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);box-shadow:inset 0 0 0 2px var(--md-sys-color-primary);border-radius:14px}
.g-ing.trap.on{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);box-shadow:inset 0 0 0 2px var(--md-sys-color-error)}
.g-ing b{display:block;font:800 13px/17px var(--font)}
.g-ing small{display:block;margin-top:3px;font:600 11px/14px var(--font);opacity:.78}

.g-risk-log{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.g-risk-tag{padding:6px 12px;border-radius:14px;background:var(--md-sys-color-surface-container-highest);font:700 12px/16px var(--font)}
.g-risk-tag.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.g-risk-tag.good{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.g-risk-tag.shield{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}

.g-hub-list{display:grid;gap:10px;padding:0 16px}
.g-hub-card{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:26px;background:var(--tc,var(--md-sys-color-surface-container-high));color:var(--on,var(--md-sys-color-on-surface));text-align:left;cursor:pointer;overflow:hidden;transition:transform .3s var(--spring),border-radius .35s var(--spring)}
.g-hub-card:active{transform:scale(.97);border-radius:18px}
.g-hub-ico{flex:none;width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 13%,transparent)}
.g-hub-ico md-icon{--md-icon-size:22px}
.g-hub-txt{flex:1;min-width:0}
.g-hub-txt b{display:block;font:800 16px/21px var(--font)}
.g-hub-txt small{display:block;margin-top:2px;font:500 12px/16px var(--font);opacity:.78}
.g-hub-badge{flex:none;padding:5px 11px;border-radius:12px;background:color-mix(in srgb,currentColor 14%,transparent);font:800 11px/15px var(--font)}

.g-grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.g-box{position:relative;min-height:70px;padding:6px 4px;border-radius:18px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;cursor:pointer;overflow:hidden;font:700 12px/15px var(--font);transition:transform .16s var(--spring),background-color .15s}
.g-box:active{transform:scale(.93)}
.g-box.safe{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);cursor:default}
.g-box.bad{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);cursor:default}
.g-box.warn{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}

.g-mgrid{touch-action:none;user-select:none}
.g-mtile{min-height:72px;padding:6px 4px;border-radius:18px;background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:background-color .14s}
.g-mtile b{font:800 12px/15px var(--font)}
.g-mtile small{font:700 10px/13px var(--font);opacity:.75;margin-top:2px}
.g-mtile.lv1{background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface)}
.g-mtile.lv2,.g-mtile.lv3{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.g-mtile.lv4,.g-mtile.lv5{background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)}
.g-mtile.lv6,.g-mtile.lv7{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-mtile.lv8,.g-mtile.lv9,.g-mtile.lv10{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.g-mctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.g-mctrl button{position:relative;height:48px;border-radius:18px;background:var(--md-sys-color-surface-container-highest);display:grid;place-items:center;overflow:hidden}
.g-mctrl button:active{transform:scale(.93)}

.g-gauge-box{padding:0 16px}
.g-gauge-track{position:relative;height:32px;border-radius:16px;background:var(--md-sys-color-surface-container-highest);overflow:hidden}
.g-gauge-zone{position:absolute;top:0;bottom:0;background:var(--md-sys-color-secondary-container);border-radius:8px}
.g-gauge-core{position:absolute;top:0;bottom:0;background:var(--md-sys-color-primary);opacity:.55}
.g-gauge-pin{position:absolute;top:2px;bottom:2px;width:6px;margin-left:-3px;border-radius:3px;background:var(--md-sys-color-error);box-shadow:0 0 0 2px var(--md-sys-color-surface)}

.g-code-hist{display:grid;gap:6px;padding:0 16px}
.g-code-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:18px;background:var(--md-sys-color-surface-container-highest)}
.g-code-pegs{display:flex;gap:6px}
.g-code-peg{width:34px;height:34px;border-radius:12px;background:var(--md-sys-color-surface-container);display:grid;place-items:center;font:800 12px/14px var(--font)}
.g-code-peg.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-code-res{display:flex;gap:6px;font:800 11px/14px var(--font)}
.g-code-res span{padding:4px 8px;border-radius:10px;background:var(--md-sys-color-surface-container-high)}
.g-code-res b.ok{color:var(--md-sys-color-primary)}
.g-code-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.g-code-slot{position:relative;height:58px;border-radius:18px;background:var(--md-sys-color-surface-container-highest);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px/14px var(--font);cursor:pointer;overflow:hidden}
.g-code-slot.on{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-code-slot.locked{box-shadow:inset 0 0 0 2px var(--md-sys-color-tertiary)}

.g-mem-card{position:relative;min-height:76px;padding:6px 4px;border-radius:18px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 11px/14px var(--font);cursor:pointer;overflow:hidden;transition:transform .16s var(--spring),background-color .16s}
.g-mem-card:active{transform:scale(.94)}
.g-mem-card.open{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
.g-mem-card.done{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);opacity:.78;cursor:default}

.g-ty-grid{display:grid;gap:10px;padding:0 16px}
.g-ty-card{padding:16px 18px;border-radius:24px;background:var(--md-sys-color-surface-container-high);display:grid;gap:8px}
.g-ty-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-ty-head b{font:800 16px/20px var(--font)}
.g-ty-sub{font:600 12px/17px var(--font);color:var(--md-sys-color-on-surface-variant)}
.g-ty-btns{display:flex;gap:8px;margin-top:2px}
.g-ty-btns .chip{flex:1;justify-content:center}

.g-ward-beds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px}
.g-bed{position:relative;padding:12px;border-radius:22px;background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface);text-align:left;display:grid;gap:6px;cursor:pointer;overflow:hidden;transition:transform .15s var(--spring),box-shadow .18s}
.g-bed:active{transform:scale(.96)}
.g-bed.sel{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);box-shadow:inset 0 0 0 2px var(--md-sys-color-primary)}
.g-bed.urg{box-shadow:inset 0 0 0 2px var(--md-sys-color-error)}
.g-bed.empty{opacity:.48;cursor:default;min-height:112px;place-content:center;text-align:center}
.g-bed-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.g-bed-top b{font:800 14px/18px var(--font)}
.g-bed-tag{padding:3px 8px;border-radius:10px;font:800 10px/13px var(--font);background:color-mix(in srgb,currentColor 14%,transparent)}
.g-bed-need{font:700 12px/16px var(--font);min-height:32px}
.g-mini-track{height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 16%,transparent);overflow:hidden}
.g-mini-fill{height:100%;border-radius:3px;background:currentColor;transition:width .1s linear}
.g-ward-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px}
.g-wact{position:relative;min-height:58px;padding:10px 12px;border-radius:20px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;overflow:hidden}
.g-wact:active{transform:scale(.95)}
.g-wact md-icon{--md-icon-size:22px;flex:none}
.g-wact b{display:block;font:800 13px/16px var(--font)}
.g-wact small{display:block;font:600 10px/13px var(--font);opacity:.78}
</style>
</head>

  <button class="fab add" id="fabAdd"><md-ripple></md-ripple><md-icon>add</md-icon><span>добавить</span></button>
</div>
<div class="snack" id="snack" role="status"></div>

<script>
const { applyM3 } = window.M3;

const ADMIN_IDS = [8148680279];
const GH = { repo: "", branch: "main", path: "data.json" };
const ALL = "все";

const ICONS = [
  ['storefront', 'магазин'], ['help', 'вопросы'], ['sports_esports', 'игра'], ['info', 'инфо'],

  ['blocks', 'инфо-блоки (текст и ссылки)'],

const DEFAULT_DATA = {
  shop: {
    name: "ешка",
    note: "бад не является лекарственным средством. перед применением проконсультируйтесь со специалистом.",
    seed: "#0000ff",
    scheme: "tonal"
  },
  tabs: [
    { id: "catalog", title: "каталог", icon: "storefront", type: "catalog" },
    { id: "faq", title: "вопросы", icon: "help", type: "faq", items: [
      { q: "как заказать?", a: "откройте товар и нажмите кнопку внизу, она ведёт на страницу заказа." },
      { q: "сколько стоит и как быстро доставка?", a: "стоимость и сроки доставки зависят от города. перейдя по ссылке, маркетплейс покажет примерную дату доставки." },
      { q: "как принимать бады?", a: "схема приёма указана в карточке товара. по любым вопросам здоровья проконсультируйтесь с врачом." }
    ]},
    { id: "game", title: "игра", icon: "sports_esports", type: "game", items: [] }
  ],
  products: [
    { name: "turbo ozempic premium", category: "прочее", price: "800", desc: "капсулы для похудения со стартовой и средней интенсивностью действия. Формула помогает контролировать аппетит, уменьшать тягу к сладкому и поддерживать процесс снижения веса без жестких ограничений. Средство способствует ускорению обмена веществ, повышению энергии и активному расщеплению жиров.", composition: "L-карнитин, экстракт зелёного чая, гарциния камбоджийская, кофеин, хром пиколинат, экстракт гуараны, витамин B6, витамин B12, микрокристаллическая целлюлоза, желатиновая капсула.", usage: "уточните тут: @mlklavmeste", link: "https://share.google/LJZrpTIS588JZWNaO" },
    { name: "molecule plus", category: "молекула", price: "1200", desc: "БАД для снижения веса, контроля аппетита и ускорения обмена веществ.", composition: "Зеленый кофе, Спирея и черный чай, Плоды кактуса, Гарциния камбоджийская, Семена фенхеля, листья ясеня и гибискус, Черный тмин и корень одуванчика", usage: "уточните тут: @mlklavmeste", link: "", btn: "", soldout: true, soldoutText: "" },
    { name: "molecule premium", category: "молекула", price: "1200", desc: "БАД для снижения веса, контроля аппетита и ускорения обмена веществ.", composition: "Зеленый кофе, Спирея и черный чай, Плоды кактуса, Гарциния камбоджийская, Семена фенхеля, листья ясеня и гибискус, Черный тмин и корень одуванчика", usage: "уточните тут: @mlklavmeste", link: "", btn: "", soldout: true, soldoutText: "" },
    { name: "molecule plus соты", category: "молекула", price: "1300", desc: "БАД для снижения веса, контроля аппетита и ускорения обмена веществ.", composition: "Зеленый кофе, Спирея и черный чай, Плоды кактуса, Гарциния камбоджийская, Семена фенхеля, листья ясеня и гибискус, Черный тмин и корень одуванчика", usage: "уточните тут: @mlklavmeste", link: "", btn: "", soldout: true, soldoutText: "" }
  ]
};

let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));

const norm = d => {
  const shop = { name: 'ешка', note: '', seed: '#6750A4', scheme: 'vibrant', ...(d.shop || {}) };
  const products = Array.isArray(d.products) ? d.products : [];
  let tabs = Array.isArray(d.tabs) && d.tabs.length ? d.tabs : [
    { id: 'catalog', title: 'каталог', icon: 'storefront', type: 'catalog' },
    { id: 'faq', title: 'вопросы', icon: 'help', type: 'faq', items: Array.isArray(d.faq) ? d.faq : [] }
  ];
  tabs = tabs.map((t, i) => ({
    id: t.id || ('tab_' + i),
    title: t.title || 'вкладка',
    icon: t.icon || 'article',
    type: ['catalog', 'faq', 'blocks', 'game'].includes(t.type) ? t.type : 'blocks',
    items: Array.isArray(t.items) ? t.items : []
  }));
  if (!tabs.some(t => t.type === 'game')) {
    tabs.push({ id: 'game', title: 'игра', icon: 'sports_esports', type: 'game', items: [] });
  }
  return { shop, tabs, products };
};

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};

async function loadData() {
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 2500);
    const r = await fetch(GH.path + '?v=' + Date.now(), { cache: 'no-store', signal: c.signal });
    if (r.ok) DATA = norm(await r.json());
  } catch (e) {}
}

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
const dur = ms => RM ? 0 : ms;
const hap = (t = 'select') => { try { tg && (t === 'select' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} };

/* ---------- material you (с персональными цветами для каждого пользователя) ---------- */
const USER_THEME_KEY = 'eshka_user_theme_v1';
const USER_SWATCHES = [
  ['#ff00ff', 'маджента'], ['#6750a4', 'фиолет'], ['#e91e63', 'малина'], ['#e53935', 'рубин'],
  ['#ff6f00', 'янтарь'], ['#f9a825', 'золото'], ['#00a86b', 'изумруд'], ['#0097a7', 'бирюза'],
  ['#1e88e5', 'кобальт'], ['#3949ab', 'индиго'], ['#7cb342', 'лайм'], ['#607d8b', 'графит']
];
function getUserTheme() {
  try {
    const raw = ls.get(USER_THEME_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveUserTheme(ut) {
  if (!ut) ls.del(USER_THEME_KEY);
  else ls.set(USER_THEME_KEY, JSON.stringify(ut));
  applyColors();
}
function applyColors() {
  const ut = getUserTheme();
  const sysDark = tg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const mode = (ut && ut.mode) || 'auto';
  const dark = mode === 'dark' || mode === 'oled' ? true : mode === 'light' ? false : sysDark;
  const s = DATA.shop;
  const rawSeed = (ut && ut.seed) || s.seed;
  const seed = /^#[0-9a-f]{6}$/i.test(rawSeed) ? rawSeed : '#6750A4';
  const scheme = (ut && ut.scheme) || s.scheme || 'vibrant';
  const c = applyM3(seed, dark, document.documentElement, scheme);
  if (mode === 'oled') {
    const root = document.documentElement.style;
    root.setProperty('--md-sys-color-surface', '#000000');
    root.setProperty('--md-sys-color-background', '#000000');
    root.setProperty('--md-sys-color-surface-dim', '#000000');
    root.setProperty('--md-sys-color-surface-container-lowest', '#000000');
    root.setProperty('--md-sys-color-surface-container-low', '#0c0c0c');
    root.setProperty('--md-sys-color-surface-container', '#121212');
    root.setProperty('--md-sys-color-surface-container-high', '#1a1a1a');
    root.setProperty('--md-sys-color-surface-container-highest', '#242424');
    c.surface = '#000000';
  }
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  try { if (tg) { tg.setHeaderColor(c.surface); tg.setBackgroundColor(c.surface); if (tg.setBottomBarColor) tg.setBottomBarColor(c.surface); } } catch (e) {}
}
if (tg) tg.onEvent('themeChanged', applyColors);
try { matchMedia('(prefers-color-scheme:dark)').addEventListener('change', applyColors); } catch (e) {}

function openUserTheme() {
  const renderThemeSheet = () => {
    const ut = getUserTheme() || {};
    const curMode = ut.mode || 'auto';
    const curScheme = ut.scheme || DATA.shop.scheme || 'vibrant';
    const curSeed = (ut.seed || DATA.shop.seed || '#6750a4').toLowerCase();
    const modes = [['auto', 'авто'], ['light', 'светлая'], ['dark', 'тёмная'], ['oled', 'oled']];
    const schemes = [['vibrant', 'яркая'], ['tonal', 'спокойная'], ['expressive', 'необычная']];
    sheet.innerHTML = `<div class="handle"></div>
      <h2 class="st" style="--i:0">цвета и тема</h2>
      <p class="hint">настройка сохраняется только на твоём устройстве и не меняет цвета у других.</p>
      <div class="g-sec-lbl">режим экрана</div>
      <div class="ut-seg">
        ${modes.map(([k, l]) => `<button type="button" class="${curMode === k ? 'on' : ''}" data-ut-mode="${k}"><md-ripple></md-ripple>${l}</button>`).join('')}
      </div>
      <div class="g-sec-lbl">стиль палитры</div>
      <div class="ut-seg s3">
        ${schemes.map(([k, l]) => `<button type="button" class="${curScheme === k ? 'on' : ''}" data-ut-scheme="${k}"><md-ripple></md-ripple>${l}</button>`).join('')}
      </div>
      <div class="g-sec-lbl">цвет акцента</div>
      <div class="ut-swatches">
        ${USER_SWATCHES.map(([hex, name]) => `<button type="button" class="ut-sw${curSeed === hex ? ' on' : ''}" style="background:${hex}" title="${name}" data-ut-seed="${hex}"><md-ripple></md-ripple>${curSeed === hex ? '<md-icon>check</md-icon>' : ''}</button>`).join('')}
      </div>
      <label class="fld"><span>свой любой цвет</span><input type="color" id="utCustomColor" class="color" value="${/^#[0-9a-f]{6}$/i.test(curSeed) ? curSeed : '#6750a4'}"></label>
      <div class="row">
        <button type="button" class="btn tonal" id="utReset"><md-ripple></md-ripple><md-icon>restart_alt</md-icon>сброс</button>
        <button type="button" class="btn fill" id="utDone"><md-ripple></md-ripple>готово</button>
      </div>`;

    const patch = part => {
      const cur = getUserTheme() || { mode: curMode, scheme: curScheme, seed: curSeed };
      saveUserTheme({ ...cur, ...part });
      renderThemeSheet();
    };
    sheet.querySelectorAll('[data-ut-mode]').forEach(b => b.addEventListener('click', () => { hap(); patch({ mode: b.dataset.utMode }); }));
    sheet.querySelectorAll('[data-ut-scheme]').forEach(b => b.addEventListener('click', () => { hap(); patch({ scheme: b.dataset.utScheme }); }));
    sheet.querySelectorAll('[data-ut-seed]').forEach(b => b.addEventListener('click', () => { hap(); patch({ seed: b.dataset.utSeed }); }));
    const col = $('utCustomColor');
    if (col) {
      col.addEventListener('input', () => {
        const cur = getUserTheme() || { mode: curMode, scheme: curScheme, seed: curSeed };
        saveUserTheme({ ...cur, seed: col.value.toLowerCase() });
      });
      col.addEventListener('change', () => renderThemeSheet());
    }
    $('utReset').addEventListener('click', () => { hap('impact'); saveUserTheme(null); renderThemeSheet(); snack('возвращены цвета магазина'); });
    $('utDone').addEventListener('click', () => { hap(); closeSheet(); });
  };
  renderThemeSheet();
  present();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';
function openLink(url) {
  if (tg && /^https?:\/\/t\.me\//i.test(url)) tg.openTelegramLink(url);
  else if (tg) tg.openLink(url);
  else window.open(url, '_blank');
}
let snT;
function snack(t) { const el = $('snack'); el.textContent = t; el.classList.add('on'); clearTimeout(snT); snT = setTimeout(() => el.classList.remove('on'), 4200); }

addEventListener('scroll', () => document.querySelectorAll('.appbar').forEach(b => b.classList.toggle('scrolled', scrollY > 4)), { passive: true });

let cat = ALL, query = '', page = 0, busy = false, adminOn = false, dirty = false;
const cats = () => [ALL, ...new Set(DATA.products.map(p => p.category).filter(Boolean))];
const look = i => `data-t="${i % 3}"`;
const edBtn = (attr, val) => `<button class="ed" ${attr}="${val}" aria-label="изменить"><md-ripple></md-ripple><md-icon>edit</md-icon></button>`;

function renderCatalogInner() {
  if (!cats().includes(cat)) cat = ALL;
  const chipsHtml = cats().map(c => `<button class="chip${c === cat ? ' on' : ''}" data-c="${esc(c)}"><md-ripple></md-ripple>${c === cat ? '<md-icon>check</md-icon>' : ''}<span>${esc(c)}</span></button>`).join('');
  const list = DATA.products.map((p, i) => ({ p, i })).filter(({ p }) =>
    (cat === ALL || p.category === cat) && (p.name || '').toLowerCase().includes(query));
  const gridHtml = list.length
    ? list.map(({ p, i }, n) => `<div class="card${p.soldout ? ' out' : ''}" role="button" tabindex="0" data-i="${i}" ${look(i)} style="--i:${Math.min(n, 8)}"><md-ripple></md-ripple>
        <div class="txt"><span class="name">${esc(p.name)}</span><span class="cat">${p.soldout ? esc(p.soldoutText || 'нет в наличии') : esc(p.category)}</span></div><span class="price">${esc(p.price)}</span>${edBtn('data-e', i)}</div>`).join('')
    : `<div class="empty">${DATA.products.length ? 'ничего не найдено. попробуйте другой запрос.' : 'каталог пуст. нажмите «добавить».'}</div>`;
  return `
    <label class="search${query ? ' has' : ''}" id="searchBox">
      <md-icon>search</md-icon>
      <input id="q" type="search" value="${esc(query)}" placeholder="поиск по товарам" autocomplete="off">
      <button class="iconbtn" id="clear" aria-label="очистить"><md-ripple></md-ripple><md-icon>close</md-icon></button>
    </label>
    <div class="chips" id="chips">${chipsHtml}</div>
    <div class="grid" id="grid">${gridHtml}</div>`;
}

function renderFaqInner(t, ti) {
  const items = t.items || [];
  return `<div class="faq">${items.length
    ? items.map((f, i) => `<details style="--i:${i}"><summary>${esc(f.q)}${edBtn('data-f', `${ti}:${i}`)}<i><md-icon>expand_more</md-icon></i></summary><p>${esc(f.a)}</p></details>`).join('')
    : '<div class="empty">вопросов пока нет. нажмите «добавить».</div>'}</div>`;
}

function renderBlocksInner(t, ti) {
  const items = t.items || [];
  return `<div class="blocks">${items.length
    ? items.map((b, i) => {
        const url = safeUrl(b.link);
        return `<div class="blk" style="--i:${i}">
          <div class="blk-head"><h3>${esc(b.title)}</h3>${edBtn('data-b', `${ti}:${i}`)}</div>
          ${b.text ? `<p>${esc(b.text)}</p>` : ''}
          ${url ? `<button class="buy" data-url="${esc(url)}"><md-ripple></md-ripple>${esc(b.btn || 'перейти')}<md-icon>arrow_outward</md-icon></button>` : ''}
        </div>`;
      }).join('')
    : '<div class="empty">здесь пока пусто. нажмите «добавить».</div>'}</div>`;
}

function renderAll() {
  if (page >= DATA.tabs.length) page = Math.max(0, DATA.tabs.length - 1);
  $('note').textContent = DATA.shop.note;
  document.title = DATA.shop.name;

  $('nav').innerHTML = DATA.tabs.map((t, i) =>
    `<button class="tab${i === page ? ' on' : ''}" data-p="${i}" aria-label="${esc(t.title)}"><md-ripple></md-ripple><md-icon>${esc(t.icon)}</md-icon><span>${esc(t.title)}</span></button>`
  ).join('');

  $('pages').innerHTML = DATA.tabs.map((t, ti) => {
    const title = t.type === 'catalog' ? DATA.shop.name : t.title;
    const body = t.type === 'catalog' ? renderCatalogInner() : t.type === 'faq' ? renderFaqInner(t, ti) : t.type === 'game' ? `<div id="game-root">${renderGameInner()}</div>` : renderBlocksInner(t, ti);
    const gameRight = t.type === 'game'
      ? `<span class="g-top-pill" id="g-top-coins"><md-icon>toll</md-icon><span>${G_SAVE.coins}</span></span><button class="g-help-btn" data-gintro="1" aria-label="правила"><md-ripple></md-ripple><md-icon>help_outline</md-icon></button>`
      : '';
    return `<section data-page="${ti}"${ti !== page ? ' hidden' : ''}>
      <header class="appbar">
        <h1>${esc(title)}</h1>
        <div class="appbar-btns g-app-right">
          ${gameRight}
          <button class="u-theme-btn" data-utheme="1" aria-label="цвета и тема"><md-ripple></md-ripple><md-icon>palette</md-icon></button>
          <button class="ed" data-tabs="1" aria-label="вкладки"><md-ripple></md-ripple><md-icon>view_carousel</md-icon></button>
          <button class="ed" data-set="1" aria-label="настройки"><md-ripple></md-ripple><md-icon>tune</md-icon></button>
        </div>
      </header>
      ${body}
    </section>`;
  }).join('');
  if ($('fabAdd')) $('fabAdd').hidden = !!(DATA.tabs[page] && DATA.tabs[page].type === 'game');
}

function updateCatalogOnly() {
  const sec = document.querySelector(`section[data-page="${page}"]`);
  if (!sec) return;
  const g = sec.querySelector('#grid'), ch = sec.querySelector('#chips');
  if (ch) {
    if (!cats().includes(cat)) cat = ALL;
    ch.innerHTML = cats().map(c => `<button class="chip${c === cat ? ' on' : ''}" data-c="${esc(c)}"><md-ripple></md-ripple>${c === cat ? '<md-icon>check</md-icon>' : ''}<span>${esc(c)}</span></button>`).join('');
  }
  if (g) {
    const list = DATA.products.map((p, i) => ({ p, i })).filter(({ p }) =>
      (cat === ALL || p.category === cat) && (p.name || '').toLowerCase().includes(query));
    g.innerHTML = list.length

/* ---------- шторка ---------- */
const sheet = $('sheet'), scrim = $('scrim');
function present() {
  sheet.scrollTop = 0; document.body.classList.add('open');
  if (tg) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}
function openSheet(i) {
  const p = DATA.products[i], url = safeUrl(p.link);
  const rows = [['описание', p.desc], ['состав', p.composition], ['приём', p.usage]].filter(r => r[1]).map(r => `<div><small>${r[0]}</small><p>${esc(r[1])}</p></div>`).join('');
  sheet.innerHTML = `<div class="handle"></div>${p.category ? `<span class="tag st" style="--i:0">${esc(p.category)}</span>` : ''}
    <h2 class="st" style="--i:1">${esc(p.name)}</h2>${p.price ? `<span class="pill st" style="--i:1.5">${esc(p.price)}</span>` : ''}
    ${rows ? `<div class="info st" style="--i:2.5">${rows}</div>` : ''}
    ${p.soldout
      ? `<button class="buy off st" style="--i:4" disabled>${esc(p.soldoutText || 'нет в наличии')}<md-icon>block</md-icon></button>`
      : url ? `<button class="buy st" style="--i:4" id="buy"><md-ripple></md-ripple>${esc(p.btn || 'перейти к товару')}<md-icon>arrow_outward</md-icon></button>` : ''}`;
  if (url && !p.soldout) $('buy').addEventListener('click', () => { hap('impact'); openLink(url); });
  present();
}
function closeSheet() {
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open');
  if (tg) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
}
scrim.addEventListener('click', closeSheet);

let drag = null;
sheet.addEventListener('touchstart', e => {
  if (!document.body.classList.contains('open') || sheet.scrollTop > 0) return;
  drag = { y: e.touches[0].clientY, t: Date.now(), dy: 0 };
}, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (!drag) return;
  const dy = Math.max(0, e.touches[0].clientY - drag.y); drag.dy = dy;
  if (dy > 0) { sheet.style.transition = scrim.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; scrim.style.opacity = .32 * (1 - Math.min(dy / 400, 1)); }
}, { passive: true });
sheet.addEventListener('touchend', () => {
  if (!drag) return;
  const { dy, t } = drag; drag = null;
  sheet.style.transition = scrim.style.transition = ''; sheet.style.transform = scrim.style.opacity = '';
  if (dy > 120 || dy / (Date.now() - t) > .6) closeSheet();
});

/* ---------- переключение вкладок ---------- */
$('nav').addEventListener('click', async e => {
  const t = e.target.closest('.tab'); if (!t) return;
  const next = +t.dataset.p; if (next === page || busy) return;
  busy = true; hap(); closeSheet();
  if (typeof gStopAllTimers === 'function') gStopAllTimers(true);
  const from = document.querySelector(`section[data-page="${page}"]`);
  const to = document.querySelector(`section[data-page="${next}"]`);
  page = next;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t));
  if (from) {
    const out = from.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur(90), easing: 'cubic-bezier(.3,0,1,1)', fill: 'forwards' });
    await out.finished; from.hidden = true; out.cancel();
  }
  if (to) {
    to.hidden = false; scrollTo(0, 0);
    to.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'scale(1)' }], { duration: dur(210), easing: 'cubic-bezier(0,0,0,1)' });
  }
  if ($('fabAdd')) $('fabAdd').hidden = !!(DATA.tabs[page] && DATA.tabs[page].type === 'game');
  busy = false;
});

/* =================== РЕДАКТИРОВАНИЕ =================== */
const fld = (k, l, v = '', t = 'text', x = '') => t === 'area'
  ? `<label class="fld"><span>${l}</span><textarea name="${k}" rows="3">${esc(v)}</textarea></label>`
  : `<label class="fld"><span>${l}</span><input name="${k}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel = (k, l, opts, val) => `<label class="fld"><span>${l}</span><select name="${k}">${opts.map(o => `<option value="${o[0]}"${o[0] === val ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>`;
const mb = (cls, icon, txt = '', id = '') => `<button type="button" class="btn ${cls}" ${id}><md-ripple></md-ripple><md-icon>${icon}</md-icon>${txt}</button>`;

function showForm({ title, body, onSave, onDelete, move, extra = '' }) {
  sheet.innerHTML = `<div class="handle"></div><h2 class="st" style="--i:0">${title}</h2>
    <form id="f" autocomplete="off">${body}${extra}<div class="row">
      ${move ? mb('tonal sq', 'arrow_upward', '', 'data-m="-1"') + mb('tonal sq', 'arrow_downward', '', 'data-m="1"') : ''}
      ${onDelete ? mb('err sq', 'delete', '', 'id="del"') : ''}
      <button type="submit" class="btn fill"><md-ripple></md-ripple>сохранить</button></div></form>`;
  const f = $('f');
  f.addEventListener('submit', e => { e.preventDefault(); if (onSave(Object.fromEntries(new FormData(f))) !== false) closeSheet(); });
  if (onDelete) {
    const d = $('del');
    d.addEventListener('click', () => {
      if (!d.classList.contains('armed')) {
        d.classList.add('armed'); d.innerHTML = '<md-ripple></md-ripple><md-icon>delete_forever</md-icon>точно?';
        setTimeout(() => { d.classList.remove('armed'); d.innerHTML = '<md-ripple></md-ripple><md-icon>delete</md-icon>'; }, 3000);
        return;
      }
      onDelete(); closeSheet();
    });
  }
  f.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { hap(); move(+b.dataset.m); }));
  present();
}

function changed() { dirty = true; ls.set('ga_draft', JSON.stringify(DATA)); renderAll(); updatePub(); }

function manageTabs() {
  const list = DATA.tabs.map((t, i) => `
    <div class="tab-item" data-ti="${i}">
      <md-icon>${esc(t.icon)}</md-icon>
      <span>${esc(t.title)}</span>
      <small>${t.type}</small>
      <md-icon>chevron_right</md-icon>
    </div>`).join('');
  sheet.innerHTML = `<div class="handle"></div><h2 class="st" style="--i:0">вкладки</h2>
    <div class="tabs-list">${list}</div>
    <div class="row"><button type="button" class="btn fill" id="addTab"><md-ripple></md-ripple><md-icon>add</md-icon>новая вкладка</button></div>`;
  sheet.querySelectorAll('.tab-item').forEach(el => el.addEventListener('click', () => { hap(); editTab(+el.dataset.ti); }));
  $('addTab').addEventListener('click', () => { hap(); editTab(-1); });
  present();

function editTab(i) {
  let idx = i; const isNew = i < 0;
  const t = isNew ? { id: 'tab_' + Date.now(), title: '', icon: 'article', type: 'blocks', items: [] } : DATA.tabs[i];
  showForm({
    title: isNew ? 'новая вкладка' : 'изменить вкладку',
    body: fld('title', 'название вкладки', t.title) + sel('icon', 'иконка', ICONS, t.icon) + (isNew ? sel('type', 'тип содержимого', TAB_TYPES, t.type) : ''),
    onSave: v => {
      if (!v.title.trim()) { snack('введите название'); return false; }
      if (isNew) {
        DATA.tabs.push({ id: t.id, title: v.title.trim().toLowerCase(), icon: v.icon, type: v.type, items: [] });
        page = DATA.tabs.length - 1;
      } else {
        DATA.tabs[idx].title = v.title.trim().toLowerCase();
        DATA.tabs[idx].icon = v.icon;
      }
      changed();
    },
    onDelete: (!isNew && DATA.tabs.length > 1) ? () => { DATA.tabs.splice(idx, 1); if (page >= DATA.tabs.length) page = 0; changed(); } : null,
    move: isNew ? null : d => {
      const j = idx + d; if (j < 0 || j >= DATA.tabs.length) return;
      [DATA.tabs[idx], DATA.tabs[j]] = [DATA.tabs[j], DATA.tabs[idx]];
      if (page === idx) page = j; else if (page === j) page = idx;
      idx = j; changed(); snack('порядок вкладок изменён');
    }
  });
}

function editProduct(i) {

      fld('price', 'цена', p.price) + fld('desc', 'описание', p.desc, 'area') + fld('composition', 'состав', p.composition, 'area') +
      fld('usage', 'приём', p.usage, 'area') + fld('link', 'ссылка для кнопки (https://…)', p.link, 'url') +

}

/* ---------- github: токен и публикация ---------- */
function repoSlug() {
  if (GH.repo) return GH.repo; const r = ls.get('ga_repo'); if (r) return r;
  const h = location.hostname; if (h.endsWith('.github.io')) { const seg = location.pathname.split('/')[1]; return h.split('.')[0] + '/' + (seg && seg !== 'index.html' ? seg : h); }
  return '';
}
function openToken() {
  showForm({
    title: 'подключение github',
    body: `<p class="hint">создайте токен: github → settings → developer settings → fine-grained tokens. доступ только к этому репозиторию, право «contents: read and write». токен хранится только на этом устройстве.</p>` +
      fld('repo', 'репозиторий (владелец/название)', repoSlug()) + fld('token', 'токен', '', 'password', 'placeholder="github_pat_…"'),
    onSave: v => {
      if (!/^[\w.-]+\/[\w.-]+$/.test(v.repo.trim())) { snack('репозиторий в формате владелец/название'); return false; }
      if (!v.token.trim() && !ls.get('ga_token')) { snack('вставьте токен'); return false; }
      ls.set('ga_repo', v.repo.trim()); if (v.token.trim()) ls.set('ga_token', v.token.trim());
      if (!adminOn) setAdmin(true); snack('сохранено');
    }
  });
}
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${repoSlug()}${path}`, { ...opts, headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + ls.get('ga_token'), 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || r.status), { status: r.status });
  return j;
}
async function publish() {
  if (!repoSlug() || !ls.get('ga_token')) { openToken(); return; }
  const fab = $('fabPub'); fab.classList.add('busy'); fab.querySelector('span').textContent = 'публикуем…';
  const br = GH.branch, body = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2) + '\n')));
  try {
    for (let k = 0; ; k++) {
      let sha; try { sha = (await gh(`/contents/${GH.path}?ref=${br}`)).sha; } catch (e) { if (e.status !== 404) throw e; }
      try { await gh(`/contents/${GH.path}`, { method: 'PUT', body: JSON.stringify({ message: 'обновление каталога', content: body, sha, branch: br }) }); break; }
      catch (e) { if ((e.status === 409 || e.status === 422) && k < 1) continue; throw e; }
    }
    dirty = false; ls.del('ga_draft'); updatePub(); hap('impact'); snack('опубликовано. у всех обновится примерно через минуту');
  } catch (e) {
    snack(e.status === 401 ? 'токен не подходит. проверьте его в настройках' : e.status === 403 || e.status === 404 ? 'нет доступа к репозиторию. проверьте токен и название' : 'не удалось опубликовать: ' + e.message);
  } finally { fab.classList.remove('busy'); fab.querySelector('span').textContent = 'опубликовать'; }
}

$('fabPub').addEventListener('click', publish);

});

/* ---------- режим редактирования: долгое нажатие на заголовок ---------- */
const allowed = () => !ADMIN_IDS.length || !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && ADMIN_IDS.includes(tg.initDataUnsafe.user.id));
function setAdmin(on) {
  adminOn = on; document.body.classList.toggle('admin', on); ls.set('ga_on', on ? '1' : '0');
  if (on) { const d = ls.get('ga_draft'); if (d) { try { DATA = norm(JSON.parse(d)); dirty = true; applyColors(); renderAll(); } catch (e) {} } }
  updatePub(); if (on) snack('режим редактирования включён');
}
function toggleAdmin() {
  if (adminOn) { setAdmin(false); snack('режим редактирования выключен'); return; }
  if (!allowed()) return;
  if (!ls.get('ga_token') || !repoSlug()) openToken(); else setAdmin(true);
}

function gUseConsumable(id) {
  if ((G_SAVE.bag[id] || 0) <= 0) { snack('нет в запасе — купите в клинике'); return; }
  if (id === 'audit') {
    const c = G_STATE.curCase;
    let found = 0;
    ['profile','meds','chat'].forEach(sec => {
      c.facts.filter(f => f.sec === sec).forEach((f, idx) => {
        if (f.status !== 'safe') {
          G_STATE.flags[`${sec}_${idx}`] = true;
          if (f.fix) G_STATE.selFixes[f.fix] = true;
          if (f.reason) G_STATE.selRej[f.reason] = true;
          found++;
        }
      });
    });
    G_SAVE.bag.audit--;
    gPersist();
    refreshGameDom(false);
    snack(`аудит вскрыл угроз: ${found}`);
    return;
  }
  if (id === 'shield') {
    if (G_STATE.buffs.shield) { snack('страховой щит уже активен'); return; }
    G_SAVE.bag.shield--;
    G_STATE.buffs.shield = true;
    gPersist();
    refreshGameDom(false);
    snack('страховой щит активирован на эту смену');
    return;
  }
  if (id === 'double') {
    if (G_STATE.buffs.double) { snack('удвоитель ×2 уже активен'); return; }
    G_SAVE.bag.double--;
    G_STATE.buffs.double = true;
    gPersist();
    refreshGameDom(false);
    snack('двойной гонорар ×2 активен до конца смены!');
  }

function gStartBlitz() {
  gStopBlitz(true);
  let startSec = 60 + (G_SAVE.upg.blitzTime || 0) * 5;
  let startCombo = 0;
  if ((G_SAVE.bag.cocktail || 0) > 0) {
    G_SAVE.bag.cocktail--;
    startSec += 15;
    startCombo = 3;
    gPersist();
    snack('турбо-микс: +15 сек и старт комбо ×3!');
  }
  G_BLITZ.active = true;
  G_BLITZ.timeLeft = startSec;
  G_BLITZ.maxTime = startSec;
  G_BLITZ.score = 0;
  G_BLITZ.combo = startCombo;
  G_BLITZ.maxCombo = startCombo;
  G_BLITZ.right = 0;
  G_BLITZ.cur = G_BLITZ_POOL[Math.floor(Math.random() * G_BLITZ_POOL.length)];
  refreshGameDom(false);

  G_BLITZ.timerId = setInterval(() => {
    if (!G_BLITZ.active) return;
    G_BLITZ.timeLeft = Math.max(0, +(G_BLITZ.timeLeft - 0.1).toFixed(1));
    const tEl = $('g-bl-time'), bEl = $('g-bl-bar');
    if (tEl) tEl.textContent = G_BLITZ.timeLeft.toFixed(1) + ' с';
    if (bEl) bEl.style.width = Math.min(100, (G_BLITZ.timeLeft / G_BLITZ.maxTime) * 100) + '%';
    if (G_BLITZ.timeLeft <= 0) gFinishBlitz();
  }, 100);
}

function gAnswerBlitz(ans) {
  if (!G_BLITZ.active || !G_BLITZ.cur) return;
  const cur = G_BLITZ.cur;
  if (ans === cur.ans) {
    G_BLITZ.combo++;
    G_BLITZ.right++;
    G_BLITZ.maxCombo = Math.max(G_BLITZ.maxCombo, G_BLITZ.combo);
    const mult = Math.min(5, 1 + Math.floor(G_BLITZ.combo / 3));
    G_BLITZ.score += 10 * mult;
    G_BLITZ.timeLeft = Math.min(G_BLITZ.maxTime + 15, +(G_BLITZ.timeLeft + 1.8).toFixed(1));
    hap();
  } else {
    G_BLITZ.combo = 0;
    G_BLITZ.timeLeft = Math.max(0, +(G_BLITZ.timeLeft - 4.0).toFixed(1));
    hap('impact');
    snack('ошибка: ' + cur.hint);
  }
  if (G_BLITZ.timeLeft <= 0) { gFinishBlitz(); return; }
  // Pick next distinct question
  let next;
  do { next = G_BLITZ_POOL[Math.floor(Math.random() * G_BLITZ_POOL.length)]; } while (next === cur && G_BLITZ_POOL.length > 1);
  G_BLITZ.cur = next;

  const qEl = $('g-bl-q'), sEl = $('g-bl-score'), cEl = $('g-bl-combo');
  if (qEl) qEl.textContent = next.q;
  if (sEl) sEl.textContent = G_BLITZ.score;
  if (cEl) cEl.textContent = `комбо ×${Math.min(5, 1 + Math.floor(G_BLITZ.combo / 3))} (${G_BLITZ.right})`;
}

function gFinishBlitz() {
  gStopBlitz(true);
  const isRec = G_BLITZ.right > (G_SAVE.blitzBest || 0);
  if (isRec) G_SAVE.blitzBest = G_BLITZ.right;
  const licB = G_SAVE.lic.consilium ? 1.5 : 1;
  const earn = Math.round((G_BLITZ.score * 0.6 + G_BLITZ.right * 4) * gLicMult() * licB);

}

const G_MERGE_NAMES = ['', 'вода', 'ромашка', 'цикорий', 'гречка', 'turbo', 'plus 40', 'premium', 'plus 30', 'баланс', 'идеал!'];
const G_MERGE = { board: Array(16).fill(0), score: 0, over: false };
function gSpawnMergeTile() {
  const emp = [];
  for (let i = 0; i < 16; i++) if (!G_MERGE.board[i]) emp.push(i);
  if (!emp.length) return;
  G_MERGE.board[emp[Math.floor(Math.random() * emp.length)]] = Math.random() < 0.85 ? 1 : 2;
}
function gCanMoveMerge() {
  for (let i = 0; i < 16; i++) {
    if (!G_MERGE.board[i]) return true;
    const r = Math.floor(i / 4), c = i % 4;
    if (c < 3 && G_MERGE.board[i] === G_MERGE.board[i + 1]) return true;
    if (r < 3 && G_MERGE.board[i] === G_MERGE.board[i + 4]) return true;
  }
  return false;
}
function gInitMerge() {
  G_MERGE.board = Array(16).fill(0); G_MERGE.score = 0; G_MERGE.over = false;
  gSpawnMergeTile(); gSpawnMergeTile();
}
gInitMerge();
function gMoveMerge(dir) {
  if (G_MERGE.over) return;
  const b = G_MERGE.board.slice();
  let moved = false;
  const lineIdx = line => {
    const out = [];
    for (let k = 0; k < 4; k++) {
      if (dir === 'left') out.push(line * 4 + k);
      else if (dir === 'right') out.push(line * 4 + (3 - k));
      else if (dir === 'up') out.push(k * 4 + line);
      else out.push((3 - k) * 4 + line);
    }
    return out;
  };
  for (let l = 0; l < 4; l++) {
    const idxs = lineIdx(l);
    const vals = idxs.map(i => b[i]).filter(Boolean);
    const merged = [];
    for (let j = 0; j < vals.length; j++) {
      if (j + 1 < vals.length && vals[j] === vals[j + 1]) {
        const nxt = Math.min(10, vals[j] + 1);
        merged.push(nxt);
        G_MERGE.score += Math.pow(2, nxt);
        j++;
      } else merged.push(vals[j]);
    }
    while (merged.length < 4) merged.push(0);
    idxs.forEach((pos, k) => {
      if (b[pos] !== merged[k]) moved = true;
      b[pos] = merged[k];
    });
  }
  if (!moved) return;
  G_MERGE.board = b;
  gSpawnMergeTile();
  if (G_MERGE.score > (G_SAVE.mergeBest || 0)) { G_SAVE.mergeBest = G_MERGE.score; gPersist(); }
  if (!gCanMoveMerge()) { G_MERGE.over = true; hap('impact'); snack('ходов больше нет! заберите награду за очки'); }
  else hap();
  gCheckAchs();
  refreshGameDom(false);
}
function gCleanMerge() {
  if (G_SAVE.coins < 80) { snack('нужно 80 🪙 для очистки плитки'); return; }
  const nonZero = [];
  for (let i = 0; i < 16; i++) if (G_MERGE.board[i] > 0) nonZero.push({ i, v: G_MERGE.board[i] });
  if (nonZero.length < 3) { snack('на поле и так много места'); return; }
  nonZero.sort((a, b) => a.v - b.v);
  G_SAVE.coins -= 80;
  G_MERGE.board[nonZero[0].i] = 0;
  G_MERGE.over = !gCanMoveMerge();
  gPersist();
  refreshGameDom(false);
  snack('убрана мелкая плитка (-80 🪙)');
}

  const earn = G_MERGE.score >= 40 ? Math.round((G_MERGE.score / 18) * gLicMult()) : 0;

function gSetGaugeStake(s) { if (!G_GAUGE.active) { G_GAUGE.stake = s; refreshGameDom(false); } }
function gStopGauge(silent = false) {
  if (G_GAUGE.rafId) { cancelAnimationFrame(G_GAUGE.rafId); G_GAUGE.rafId = null; }
  G_GAUGE.active = false;
  if (!silent && G_STATE.sub === 'arcade' && G_STATE.arcSub === 'gauge') refreshGameDom(false);

function gSetupGaugeRound(r) {
  const widths = [28, 22, 18, 14, 11];

  G_GAUGE.tStart = Math.round(12 + Math.random() * (76 - G_GAUGE.tWidth));

  G_GAUGE.pos = Math.random() < 0.5 ? 5 : 95;
  G_GAUGE.dir = G_GAUGE.pos < 50 ? 1 : -1;
}
function gLoopGauge(ts) {
  if (!G_GAUGE.active) return;
  if (!G_GAUGE.lastTs) G_GAUGE.lastTs = ts;
  const dt = Math.min(0.05, (ts - G_GAUGE.lastTs) / 1000);
  G_GAUGE.lastTs = ts;
  G_GAUGE.pos += G_GAUGE.dir * G_GAUGE.speed * dt;
  if (G_GAUGE.pos >= 100) { G_GAUGE.pos = 100; G_GAUGE.dir = -1; }
  if (G_GAUGE.pos <= 0) { G_GAUGE.pos = 0; G_GAUGE.dir = 1; }
  const pin = $('g-ga-pin');
  if (pin) pin.style.left = G_GAUGE.pos.toFixed(2) + '%';
  G_GAUGE.rafId = requestAnimationFrame(gLoopGauge);
}
function gStartGauge() {
  if (G_SAVE.coins < G_GAUGE.stake) { snack('недостаточно монет'); return; }
  if (G_GAUGE.stake > 0) { G_SAVE.coins -= G_GAUGE.stake; gPersist(); }
  gStopAllTimers(true);
  G_GAUGE.active = true; G_GAUGE.ended = false; G_GAUGE.won = false;
  G_GAUGE.lastWin = 0; G_GAUGE.lives = 2; G_GAUGE.mult = 1.0; G_GAUGE.note = '';

  G_GAUGE.lastTs = 0;
  refreshGameDom(false);
  G_GAUGE.rafId = requestAnimationFrame(gLoopGauge);
}
function gHitGauge() {
  if (!G_GAUGE.active) return;
  const p = G_GAUGE.pos, s = G_GAUGE.tStart, e = s + G_GAUGE.tWidth, c = (s + e) / 2, cw = G_GAUGE.tWidth * 0.22;
  if (Math.abs(p - c) <= cw) {

    G_GAUGE.mult = +(G_GAUGE.mult + 0.30).toFixed(2);

    hap();

  gSetupGaugeRound(G_GAUGE.round + 1);
  G_GAUGE.lastTs = 0;
  refreshGameDom(false);
  if (G_GAUGE.rafId) cancelAnimationFrame(G_GAUGE.rafId);
  G_GAUGE.rafId = requestAnimationFrame(gLoopGauge);
}
function gCashGauge() {
  if (!G_GAUGE.active) return;
  gStopGauge(true);
  const win = G_GAUGE.stake > 0 ? Math.round(G_GAUGE.stake * G_GAUGE.mult) : Math.round(G_GAUGE.mult * 45 * gLicMult());

  let exact = 0, near = 0;
  for (let i = 0; i < 4; i++) {
    if (G_CODE.guess[i] === G_CODE.secret[i]) exact++;
    else if (G_CODE.secret.includes(G_CODE.guess[i])) near++;
  }
  G_CODE.history.push({ guess: G_CODE.guess.slice(), exact, near });
  if (exact === 4) {
    const tr = G_CODE.history.length;
    const mult = tr === 1 ? 4 : tr <= 3 ? 2.8 : tr === 4 ? 2.2 : 1.6;
    const win = G_CODE.stake > 0 ? Math.round(G_CODE.stake * mult) : Math.round(120 * mult * gLicMult());

    snack('попытки кончились! правильный код показан');
    refreshGameDom(false);
    return;
  }
  G_CODE.guess = [0, 1, 2, 3].map(i => G_CODE.locked[i] || null);
  refreshGameDom(false);
}

  const deck = [];

function gTapMem(i) {

function gTyRunDay() {
  const ty = G_SAVE.tycoon;
  let ad = G_TY_ADS.find(x => x.id === ty.ad) || G_TY_ADS[0];
  if (G_SAVE.coins < ad.cost) { ad = G_TY_ADS[0]; ty.ad = 'none'; snack('на рекламу не хватило монет — смена без рекламы'); }
  if (ad.cost > 0) G_SAVE.coins -= ad.cost;

  let baseFlow = ty.staff.s3 * 2, totalRent = 0, priceMult = 1, vipShift = 0;
  G_TY_BRANCHES.forEach(b => {
    if (ty.branches[b.id]) {
      baseFlow += b.flow; totalRent += b.rent;
      priceMult = Math.max(priceMult, b.priceMult);
      vipShift = Math.max(vipShift, b.vip);
    }
  });
  const totalClients = Math.max(2, Math.round(baseFlow * ad.mult * (0.75 + ty.rep / 220) * (0.9 + Math.random() * 0.2)));
  const shares = [0.35 - vipShift * 0.3, 0.28, 0.22 + vipShift * 0.15, 0.15 + vipShift * 0.15];
  let rev = 0, soldTot = 0, missedTot = 0;
  const soldDet = [];
  for (let i = 0; i < 4; i++) {
    const want = Math.max(0, Math.round(totalClients * shares[i]));
    const have = ty.stock[i] || 0;
    const sold = Math.min(want, have);
    ty.stock[i] = have - sold;
    soldTot += sold;
    missedTot += Math.max(0, want - sold);
    rev += sold * G_TY_PRODS[i].sell;
    if (sold > 0) soldDet.push(`${G_TY_PRODS[i].name.split(' ')[0]}:${sold}`);
  }
  const staffBonus = 1 + (ty.staff.s2 || 0) * 0.10;
  const gross = Math.round(rev * priceMult * staffBonus);
  const net = gross - totalRent;

  if (net > 0) ty.totalEarned = (ty.totalEarned || 0) + net;

  const repDelta = ad.rep + (ty.staff.s0 || 0) * 0.5 - Math.max(0, missedTot * 0.8 - (ty.staff.s0 || 0) * 0.5) + (missedTot === 0 && soldTot > 0 ? 2 : 0);

  ty.day++;
  gTyRollPrices();

  const summary = `день #${doneDay}: продано ${soldTot} уп. (ушло из-за дефицита: ${missedTot}), выручка ${gross} 🪙 − аренда ${totalRent} 🪙 = ${net >= 0 ? '+' : ''}${net} 🪙`;
  ty.lastLog = summary;
  gPersist(); gCheckAchs();

  if (doneDay % 3 === 0 || Math.random() < 0.32) {
    refreshGameDom(false);
    gTyOpenEvent(summary);
  } else {
    refreshGameDom(false);
    snack(`день #${doneDay}: ${net >= 0 ? '+' : ''}${net} 🪙 чистыми`);
  }
}

function gFinishWard(manualAbort = false) {

  const wasActive = G_WARD.active;
  gStopWard(true);
  if (!wasActive) return;
  const failed = manualAbort || G_WARD.complaints >= 3;
  const stMult = 1 + (G_SAVE.ward.upg.station || 0) * 0.15;
  const win = failed ? Math.round(G_WARD.healed * 8 * gLicMult()) : Math.round(G_WARD.healed * 28 * sh.mult * stMult * gLicMult());
  G_WARD.ended = true; G_WARD.won = !failed; G_WARD.lastWin = win;

  G_SAVE.ward.totalHealed = (G_SAVE.ward.totalHealed || 0) + G_WARD.healed;
  if (!failed) {
    G_SAVE.ward.bestScore = Math.max(G_SAVE.ward.bestScore || 0, G_WARD.healed);
    if (sh.id === 'friday') G_SAVE.ward.bestFri = Math.max(G_SAVE.ward.bestFri || 0, G_WARD.healed);
    G_SAVE.rankXp++;
  }

  hap('impact');

function gStartWard() {
  const sh = G_WARD_SHIFTS.find(s => s.id === G_WARD.shiftId) || G_WARD_SHIFTS[0];
  if (G_SAVE.coins < sh.cost) { snack(`нужно ${sh.cost} 🪙 на запуск смены`); return; }
  if (sh.cost > 0) { G_SAVE.coins -= sh.cost; gPersist(); }
  gStopAllTimers(true);
  const maxBeds = 3 + (G_SAVE.ward.upg.bed4 ? 1 : 0);
  G_WARD.active = true; G_WARD.ended = false; G_WARD.won = false; G_WARD.lastWin = 0;
  G_WARD.timeLeft = sh.dur; G_WARD.maxTime = sh.dur;
  G_WARD.healed = 0; G_WARD.complaints = 0; G_WARD.selBed = 0;
  G_WARD.spawnAcc = 0; G_WARD.nurseAcc = 0;
  G_WARD.beds = Array(maxBeds).fill(null);
  gSpawnWardPatient(0);
  gSpawnWardPatient(1);
  refreshGameDom(false);

  const decayPerTick = (sh.decay * Math.pow(0.84, G_SAVE.ward.upg.station || 0)) * 0.1;
  const nurseLv = G_SAVE.ward.upg.nurse || 0;
  const nursePeriod = nurseLv === 1 ? 7000 : nurseLv === 2 ? 5000 : 3500;

  G_WARD.timerId = setInterval(() => {
    if (!G_WARD.active) return;
    G_WARD.timeLeft = Math.max(0, +(G_WARD.timeLeft - 0.1).toFixed(1));
    G_WARD.spawnAcc += 100;
    if (G_WARD.spawnAcc >= sh.spawnMs) {
      G_WARD.spawnAcc = 0;
      const emp = [];
      for (let i = 0; i < maxBeds; i++) if (!G_WARD.beds[i]) emp.push(i);
      if (emp.length) gSpawnWardPatient(emp[Math.floor(Math.random() * emp.length)]);
    }
    if (nurseLv > 0) {
      G_WARD.nurseAcc += 100;
      if (G_WARD.nurseAcc >= nursePeriod) {
        G_WARD.nurseAcc = 0;
        let worstIdx = -1, worstPat = 999;
        for (let i = 0; i < maxBeds; i++) {
          if (G_WARD.beds[i] && G_WARD.beds[i].pat < worstPat) { worstPat = G_WARD.beds[i].pat; worstIdx = i; }
        }
        if (worstIdx >= 0) {
          const wb = G_WARD.beds[worstIdx];
          wb.reqs.shift();
          wb.pat = Math.min(100, wb.pat + 25);
          if (!wb.reqs.length) {
            G_WARD.healed += (wb.vip ? 2 : 1);
            G_WARD.beds[worstIdx] = null;

        G_WARD.complaints++;
        hap('impact');
        snack(`жалоба пациента! (${G_WARD.complaints}/3)`);
        if (G_WARD.complaints >= 3) { gFinishWard(false); return; }
      }

    gPatchWardDom();
    if (G_WARD.timeLeft <= 0) gFinishWard(false);

function gSubmitVerdict() {

  if (G_STATE.vMode === 'reject' && !Object.values(G_STATE.selRej).some(Boolean)) { hap('impact'); snack('укажите причину отказа'); return; }

  let score = 0, issues = [], tag = 'идеальный курс', tagBg = 'var(--md-sys-color-tertiary-container)', tagFg = 'var(--md-sys-color-on-tertiary-container)', title = '', desc = '';

        title = 'отказ верный, причина неточна';
        desc = 'курс отклонён правильно, но часть причин из медкарты упущена.';
        issues.push('точная причина: ' + c.rejectReasons.map(r => G_REJECTS.find(o => o.id === r).label).join(', '));

  } else {
    if (G_STATE.vMode === 'reject') {
