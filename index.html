      score = 100;
      if (G_STATE.selProd !== c.bestProduct) {
        score -= 25;
        issues.push(`лучше подходил ${G_PRODS[c.bestProduct].name} (вы выбрали ${G_PRODS[G_STATE.selProd].name})`);
      }
      const pickedF = Object.keys(G_STATE.selFixes).filter(k => G_STATE.selFixes[k]);
      const missedF = c.fixes.filter(f => !pickedF.includes(f));
      const extraF = pickedF.filter(f => !c.fixes.includes(f));
      if (missedF.length) {
        score -= missedF.length * 25;
        issues.push('упущено: ' + missedF.map(f => G_FIXES.find(o => o.id === f).label).join(', '));
      }
      if (extraF.length) score -= extraF.length * 10;

  const spotted = c.facts.filter(f => f.status !== 'safe' && Object.keys(G_STATE.flags).some(k => k.startsWith(f.sec + '_') && c.facts.filter(x => x.sec === f.sec)[+k.split('_')[1]] === f)).length;

  const isVipRun = G_STATE.mode === 'vip';
  const btnTxt = isVipRun ? 'вернуться в архив' : (G_STATE.lives <= 0 ? 'новая смена' : (G_STATE.num >= G_STATE.total ? 'итоги смены' : 'следующий пациент'));
  const epilogue = score >= 80 ? (c.winStory || desc) : (score < 55 ? (c.loseStory || desc) : desc);

  sheet.innerHTML = `<div class="handle"></div>
    <span class="tag st" style="--i:0;background:${tagBg};color:${tagFg}">${tag}</span>
    <h2 class="st" style="--i:1">${esc(title)}</h2>
    <div class="info st" style="--i:2">
      <div><small>что произошло дальше</small><p>${esc(epilogue)}</p></div>
      <div><small>разбор решения</small><p>${esc(desc)}</p></div>
      <div><small>награда</small><p>+${earn} монет · найдено улик: ${spotted}</p></div>
      ${issues.length ? `<div><small style="color:var(--md-sys-color-error)">на что обратить внимание</small><p>${issues.map(esc).join('\n')}</p></div>` : ''}
    </div>
    <button type="button" class="buy st" style="--i:3" id="g-next"><md-ripple></md-ripple>${btnTxt}<md-icon>arrow_forward</md-icon></button>`;

  $('g-next').addEventListener('click', () => {
    hap();
    if (isVipRun) {
      closeSheet();
      G_STATE.mode = 'career';
      G_STATE.sub = 'clinic';
      G_STATE.clinicSec = 'archive';
      gLoadCase(true);
      refreshGameDom(true);
      return;
    }
    if (G_STATE.lives <= 0) {
      closeSheet();
      G_STATE.mode = 'career';
      gLoadCase(true);
      refreshGameDom(true);
      return;
    }
    if (G_STATE.num >= G_STATE.total) {
      if (G_STATE.mode === 'daily') {
        closeSheet();
        G_SAVE.lastDaily = new Date().toISOString().slice(0, 10);
        G_SAVE.streak++;
        G_SAVE.coins += 120;
        gPersist();
        snack(`дейли завершён: +120 монет • стрик ${G_SAVE.streak}д`);
        G_STATE.mode = 'career';
        gLoadCase(true);
        refreshGameDom(true);
      } else {
        // Show End-of-Shift Dilemma!
        gShowDilemma();
      }
      return;
    }
    closeSheet();
    G_STATE.num++;
    gLoadCase(false);
    refreshGameDom(true);
  });
}

function gBuildSecChipsHtml(c) {
  const secs = [['profile','профиль'],['meds','медкарта'],['chat','чек и чат']];
  return secs.map(([k, lbl]) => {
    const cnt = c.facts.filter(f => f.sec === k).length;
    const hasTrap = (G_SAVE.upg.scanner > 0) && c.facts.some(f => f.sec === k && f.status !== 'safe');
    return `<button class="g-seg-btn${G_STATE.sec === k ? ' on' : ''}" data-gsec="${k}"><md-ripple></md-ripple><span>${lbl} (${cnt})</span>${hasTrap ? '<i class="g-dot-ind"></i>' : ''}</button>`;
  }).join('');
}

function gBuildFactsHtml(c) {
  const items = c.facts.filter(f => f.sec === G_STATE.sec);
  return items.map((f, idx) => {
    const flagged = !!G_STATE.flags[`${f.sec}_${idx}`];
    const cls = flagged ? ` f-${f.status}` : ((G_SAVE.upg.scanner > 0 && f.status !== 'safe' && idx === 0) ? ' scan' : '');
    const bTxt = f.status === 'ban' ? 'противопоказано' : f.status === 'bad' ? 'нарушение' : f.status === 'caution' ? 'осторожно' : 'допустимо';
    return `<div class="g-fact${cls}" data-gfact="${idx}">
      <md-ripple></md-ripple>
      <div class="g-ftop">
        <div><span class="g-flbl">${esc(f.lbl)}</span><span class="g-fval">${esc(f.val)}</span></div>
        ${flagged ? `<span class="g-fbadge">${bTxt}</span>` : ''}
      </div>
      ${flagged ? `<div class="g-fnote">${esc(f.hint)}</div>` : ''}
    </div>`;
  }).join('');
}

    const rules = [
      { q: 'как выбрать один из 4 препаратов', a: '• turbo ozempic — самый мягкий: новичкам, при небольшом лишнем весе (цель -2…5 кг).\n• molecule plus 40 — сильнее ozempic, мягче премиума: для уверенного сброса 6–9 кг.\n• molecule premium (40+6) — высокий уровень: при частых срывах, стрессовом жоре и цели -10…14 кг.\n• molecule plus 30 (металл) — максимальная мощность: пробивает давнее «плато» и цель 15+ кг (только полностью здоровым!).' },

      { q: 'питание, напитки и запрет кофеина', a: '• запрещено (кофеин есть в самом комплексе — риск передозировки): кофе, чёрный и зелёный чай, улун, пуэр, матча, кола, энергетики, какао, горячий шоколад, холодный чай в бутылках, тирамису, тёмный шоколад (>1 дольки в день).\n• алкоголь запрещён в любом виде (даже пара глотков вызывает тошноту и головокружение).\n• разрешено: чистая вода (много!), травяной и ромашковый чай, цикорий, морс; мясо, птица, рыба, яйца, крупы, овощи, орехи; в меру — мармелад, зефир, пастила, леденцы, белый шоколад, макс. 1 долька тёмного.' },

    let innerClinic = '';
    if (G_STATE.clinicSec === 'bag') {
      const disc = G_SAVE.lic.chief ? 0.8 : 1;
      innerClinic = `<div class="blocks">${G_CONSUMABLES.map((item, i) => {

      }).join('')}</div>`;
    } else if (G_STATE.clinicSec === 'archive') {
      const vipsHtml = G_ARCHIVE_CASES.map((v, i) => {

        return `<div class="blk" style="--i:${i}">

      const achsHtml = `<div class="info" style="margin:6px 16px 0">${G_ACHS.map(a => {

        { key: 'scanner', name: 'анализатор чеков', desc: 'подсвечивает вкладки и строчки с нарушениями', costs: [80, 220] },

      ];
      const licsHtml = G_LICENSES.map((l, i) => {

      const upgsHtml = specs.map((u, i) => {

        return `<div class="blk" style="--i:${i}">

            <md-ripple></md-ripple>${maxd ? 'максимум' : `улучшить за ${cost} 🪙`}

        </div>`;
      }).join('');
      innerClinic = `<div class="g-sec-lbl" style="padding:0 20px">лицензии и статусы</div><div class="blocks">${licsHtml}</div><div class="g-sec-lbl" style="padding:0 20px">оборудование</div><div class="blocks">${upgsHtml}</div>`;
    }

    return `<div class="g-wrap${animCls}">
      ${subChips}
      <div class="g-hero">
        <div class="g-hero-top">
          <div class="g-hname">${esc(rName)}</div>
          <div class="g-hwt">-${G_SAVE.totalKg} кг</div>
        </div>
        <div class="g-hsub">доход ×${gLicMult().toFixed(2)} · стрик ${G_SAVE.streak} дн. · рекорд блица ${G_SAVE.blitzBest || 0}</div>
        ${G_SAVE.rankXp >= 6 ? `<p class="g-quote">промокод профи открыт: <b>gigachad30</b> (скидка 15%)</p>` : `<p class="g-quote">до промокода осталось верных дел: ${Math.max(0, 6 - G_SAVE.rankXp)}</p>`}
      </div>
      ${cSeg}
      ${innerClinic}
    </div>`;
  }

  const c = G_STATE.curCase;
  const dots = Array.from({ length: G_STATE.maxLives }, (_, i) => `<span class="g-dot${i >= G_STATE.lives ? ' off' : ''}"></span>`).join('');
  const modLabel = G_STATE.mode === 'daily' ? 'дейли ×2' : G_STATE.mode === 'vip' ? `vip ×${c.rewardMult}` : `${G_STATE.shiftMod.name} ×${G_STATE.shiftMod.mult}`;

  const bagBtns = [];
  if ((G_SAVE.bag.audit || 0) > 0) bagBtns.push(`<button class="g-bag-btn" data-guse="audit"><md-ripple></md-ripple><md-icon>manage_search</md-icon><span>аудит (${G_SAVE.bag.audit})</span></button>`);
  if ((G_SAVE.bag.shield || 0) > 0 || G_STATE.buffs.shield) bagBtns.push(`<button class="g-bag-btn${G_STATE.buffs.shield ? ' on' : ''}" data-guse="shield"><md-ripple></md-ripple><md-icon>shield</md-icon><span>${G_STATE.buffs.shield ? 'щит активен' : `щит (${G_SAVE.bag.shield})`}</span></button>`);
  if ((G_SAVE.bag.double || 0) > 0 || G_STATE.buffs.double) bagBtns.push(`<button class="g-bag-btn${G_STATE.buffs.double ? ' on' : ''}" data-guse="double"><md-ripple></md-ripple><md-icon>bolt</md-icon><span>${G_STATE.buffs.double ? '×2 активно' : `×2 смена (${G_SAVE.bag.double})`}</span></button>`);
  const bagHtml = bagBtns.length ? `<div class="g-bag-row">${bagBtns.join('')}</div>` : '';

  const threatsHint = (G_SAVE.upg.scanner >= 2) ? ` · скрыто угроз: ${c.facts.filter(f => f.status !== 'safe').length}` : '';

  return `<div class="g-wrap${animCls}">
    ${subChips}
    <div class="g-bar">
      <span class="g-mod-pill">${esc(modLabel)} · ${G_STATE.mode === 'vip' ? 'архив' : `${G_STATE.num}/${G_STATE.total}`}</span>
      <span class="g-dots" title="оставшиеся жизни">${dots}</span>
    </div>
    ${bagHtml}
    <div class="g-hero">
      <div class="g-hero-top">
        <div class="g-hname">${esc(c.name)}, ${c.age}</div>
        <div class="g-hwt">${esc(c.weight)} → ${esc(c.targetWeight || '')}</div>
      </div>
      <div class="g-hsub">${esc(c.job || '')} · рост ${esc(c.height || '170 см')} · имт ${esc(c.bmi || '27.5')} · ${esc(c.goal)}</div>
      <p class="g-quote">${esc(c.quote)}</p>
    </div>
    <div class="g-seg" id="g-sec-chips">${gBuildSecChipsHtml(c)}</div>
    <div class="g-hint">нажимай на пункты ниже для проверки${threatsHint}:</div>
    <div class="g-facts" id="g-facts-box">${gBuildFactsHtml(c)}</div>
    <div class="g-action">
      <button class="buy" id="g-verdict"><md-ripple></md-ripple>вынести вердикт<md-icon>fact_check</md-icon></button>
    </div>
  </div>`;
}

function refreshGameDom(animate = false) {
  const root = $('game-root');
  if (root) root.innerHTML = renderGameInner(animate);
  const topCoins = $('g-top-coins');
  if (topCoins) {
    const sp = topCoins.querySelector('span');
    if (sp) sp.textContent = G_SAVE.coins;
  }
}

window.ESHKA_BRIDGE = {
  getCoins: () => G_SAVE.coins,
  addCoins: n => {
    G_SAVE.coins = Math.max(0, (G_SAVE.coins || 0) + Math.round(Number(n) || 0));
    gPersist();
    const sp = $('g-top-coins') && $('g-top-coins').querySelector('span');
    if (sp) sp.textContent = G_SAVE.coins;
    return G_SAVE.coins;
  },
  spendCoins: n => {
    const cost = Math.round(Number(n) || 0);
    if (cost < 0 || (G_SAVE.coins || 0) < cost) return false;
    G_SAVE.coins -= cost;
    gPersist();
    const sp = $('g-top-coins') && $('g-top-coins').querySelector('span');
    if (sp) sp.textContent = G_SAVE.coins;
    return true;
  },
  snack, hap, esc,
  refreshHub: () => refreshGameDom(false)
};

(async () => {
  await loadData(); applyColors(); renderAll();
  if (ls.get('ga_on') === '1' && ls.get('ga_token') && allowed()) setAdmin(true);
})();
</script>
<script src="story_campaign.js"></script>
</body>
</html>
